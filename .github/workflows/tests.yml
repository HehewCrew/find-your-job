name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Page scripts parse
        run: node --check jobs/ui/static/app.js && node --check jobs/ui/static/setup.js && node --check jobs/ui/static/apps.js
      - name: Tests
        run: python -m pytest

  launcher:
    # What a new user does: run the start script on a fresh checkout, and the page answers.
    name: start script on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start and reach the page (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          ./start.sh --no-browser --port 8765 > launcher.log 2>&1 &
          for i in $(seq 1 180); do curl -sf http://127.0.0.1:8765/api/state > /dev/null && break; sleep 1; done
          cat launcher.log
          curl -sf http://127.0.0.1:8765/api/state
      - name: Start and reach the page (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process -FilePath cmd.exe -ArgumentList '/c', 'start.bat', '--no-browser', '--port', '8765' -NoNewWindow
          for ($i = 0; $i -lt 180; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:8765/api/state | Out-Null; break } catch { Start-Sleep 1 }
          }
          Invoke-RestMethod http://127.0.0.1:8765/api/state
