<!doctype html>
<!-- Source for social-preview.png (GitHub Settings -> Social preview, 1280x640).
     Re-render: msedge --headless --disable-gpu --hide-scrollbars --window-size=1280,640
       --screenshot=<abs path>/social-preview.png file:///<abs path>/social-preview.html
     Both paths must be absolute: a bare filename is read as a host name, not a file. -->
<html><head><meta charset="utf-8"><title>jobHunt</title>
<style>
@font-face { font-family: A; src: url("../jobs/ui/static/fonts/AtkinsonHyperlegible-Regular.woff2"); font-weight: 400; }
@font-face { font-family: A; src: url("../jobs/ui/static/fonts/AtkinsonHyperlegible-Bold.woff2"); font-weight: 700; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1280px; height: 640px; overflow: hidden; }
body { background: #F6F7F9; color: #1F2733; font-family: A, "Segoe UI", sans-serif;
  display: grid; grid-template-columns: 1fr 440px; gap: 48px; padding: 80px 80px; align-items: center; }
.kicker { color: #2B4BA0; font-weight: 700; font-size: 22px; letter-spacing: .08em; text-transform: uppercase; }
h1 { font-size: 92px; line-height: 1; margin: 18px 0 26px; letter-spacing: -.02em; }
p { font-size: 30px; line-height: 1.35; color: #5B6472; max-width: 620px; }
.chips { display: flex; gap: 10px; margin-top: 38px; flex-wrap: wrap; }
.chip { background: #E6EBF7; color: #2B4BA0; font-weight: 700; font-size: 19px; padding: 9px 15px; border-radius: 10px; }
.card { background: #fff; border: 1px solid #D9DDE3; border-radius: 16px; padding: 30px; box-shadow: 0 18px 40px rgba(31,39,51,.10); }
.step { display: flex; align-items: center; gap: 18px; padding: 16px 18px; border-radius: 10px; font-size: 25px; font-weight: 700; }
.step + .step { margin-top: 10px; }
.step span { font-weight: 400; color: #5B6472; font-size: 20px; margin-left: auto; }
.done { background: #E3F1E8; color: #2E7D4F; }
.now { background: #D5DFF4; color: #2B4BA0; }
.next { background: #F1F4FB; color: #8A8F98; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: currentColor; flex: none; }
</style></head><body>
<div>
  <div class="kicker">Open source &middot; Free</div>
  <h1>jobHunt</h1>
  <p>Find postings that fit you, tailor a CV to each one, and track every application.</p>
  <div class="chips"><div class="chip">Runs on your computer</div><div class="chip">No account</div><div class="chip">No subscription</div></div>
</div>
<div class="card">
  <div class="step done"><i class="dot"></i>Find leads<span>142 scanned</span></div>
  <div class="step done"><i class="dot"></i>Pick the good ones<span>6 kept</span></div>
  <div class="step now"><i class="dot"></i>Tailored CVs<span>building</span></div>
  <div class="step next"><i class="dot"></i>Apply</div>
  <div class="step next"><i class="dot"></i>Track<span>all in one place</span></div>
</div>
</body></html>
